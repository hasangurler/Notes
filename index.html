<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notlarım</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link rel="icon" type="image/x-icon" href="/Notes.png">
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="app-header">

    <div class="container">

        <div class="header-top">

            <div class="app-brand">

                <h1 class="app-title">
                    <i class="bi bi-journal-text"></i>
                    Notlarım
                </h1>

                <div class="app-subtitle">
                    Notlarınızı kolayca yönetin
                </div>

            </div>


            <div class="header-actions">

                <!-- Tema -->
                <button
                    type="button"
                    class="btn btn-outline-secondary theme-button"
                    id="btnTheme"
                    title="Temayı değiştir"
                >
                    <i
                        class="bi bi-moon-fill"
                        id="themeIcon"
                    ></i>
                </button>


                <!-- Yeni Not -->
                <button
                    type="button"
                    class="btn btn-primary btn-new-note"
                    id="btnNewNote"
                >
                    <i class="bi bi-plus-lg"></i>
                    <span>Yeni Not</span>
                </button>

            </div>

        </div>


        <!-- =================================================
             TOOLBAR
        ================================================= -->

        <div class="toolbar">

            <!-- Arama -->

            <div class="search-wrapper">

                <i class="bi bi-search search-icon"></i>

                <input
                    type="search"
                    id="searchInput"
                    class="form-control search-input"
                    placeholder="Notlarda ara..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-clear d-none"
                    id="btnClearSearch"
                    title="Aramayı temizle"
                >
                    <i class="bi bi-x-circle-fill"></i>
                </button>

            </div>


            <!-- Sıralama -->

            <div class="sort-wrapper">

                <select
                  id="sortSelect"
                  class="form-select"
                >
                  <option value="updated-desc">
                      Son güncellenen
                  </option>

                  <option value="created-desc">
                      Son oluşturulan
                  </option>

                  <option value="title-asc">
                      Başlık A-Z
                  </option>

                  <option value="title-desc">
                      Başlık Z-A
                  </option>

                  <option value="manual">
                      Manuel sıralama
                  </option>
              </select>

            </div>

        </div>


        <!-- Not sayısı -->

        <div
            class="notes-counter"
            id="notesCounter"
        >
            0 Not
        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container py-4">


    <!-- Boş durum -->

    <div
        id="emptyState"
        class="empty-state d-none"
    >

        <i
            class="bi bi-journal-x"
            id="emptyStateIcon"
        ></i>

        <h3 id="emptyStateTitle">
            Henüz not yok
        </h3>

        <p id="emptyStateMessage">
            İlk notunuzu oluşturmak için
            Yeni Not butonuna tıklayın.
        </p>

        <button
            type="button"
            class="btn btn-primary"
            id="btnEmptyNewNote"
        >
            <i class="bi bi-plus-lg"></i>
            Yeni Not Oluştur
        </button>

    </div>


    <!-- Notlar -->

    <div
        class="row g-4"
        id="notesContainer"
    ></div>

</main>


<!-- =========================================================
     NOT MODAL
========================================================= -->

<div
    class="modal fade"
    id="noteModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-dialog-centered modal-lg"
    >

        <div class="modal-content">


            <!-- Modal Header -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="noteModalTitle"
                >
                    Yeni Not
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Kapat"
                ></button>

            </div>


            <!-- Modal Body -->

            <div class="modal-body">

                <form id="noteForm">

                    <input
                        type="hidden"
                        id="noteId"
                    >


                    <!-- Başlık -->

                    <div class="mb-3">

                        <div class="form-label-row">

                            <label
                                for="noteTitle"
                                class="form-label"
                            >
                                Başlık
                            </label>

                            <span
                                class="character-counter"
                                id="titleCounter"
                            >
                                0 / 200
                            </span>

                        </div>


                        <input
                            type="text"
                            class="form-control"
                            id="noteTitle"
                            maxlength="200"
                            placeholder="Not başlığı"
                            autocomplete="off"
                        >


                        <div class="invalid-feedback">
                            Başlık boş bırakılamaz.
                        </div>

                    </div>


                    <!-- Gövde -->

                    <div class="mb-3">

                        <div class="form-label-row">

                            <label
                                for="noteBody"
                                class="form-label"
                            >
                                Not
                            </label>

                            <span
                                class="character-counter"
                                id="bodyCounter"
                            >
                                0 / 5000
                            </span>

                        </div>


                        <textarea
                            class="form-control note-body-input"
                            id="noteBody"
                            maxlength="5000"
                            rows="10"
                            placeholder="Notunuzu yazın..."
                        ></textarea>


                        <div class="invalid-feedback">
                            Not boş bırakılamaz.
                        </div>

                    </div>


                    <!-- Renk -->

                    <div class="mb-3">

                        <label class="form-label">
                            Not rengi
                        </label>


                        <div
                            class="note-colors"
                            id="noteColors"
                        >

                            <button
                                type="button"
                                class="color-option color-default active"
                                data-color="default"
                                title="Varsayılan"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-yellow"
                                data-color="yellow"
                                title="Sarı"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-green"
                                data-color="green"
                                title="Yeşil"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-blue"
                                data-color="blue"
                                title="Mavi"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-purple"
                                data-color="purple"
                                title="Mor"
                            ></button>

                            <button
                                type="button"
                                class="color-option color-red"
                                data-color="red"
                                title="Kırmızı"
                            ></button>

                        </div>

                    </div>


                    <!-- Tarih -->

                    <div
                        class="note-date"
                        id="noteDate"
                    ></div>

                </form>

            </div>


            <!-- Modal Footer -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancel"
                >
                    <i class="bi bi-x-lg"></i>
                    İptal
                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    id="btnDelete"
                >
                    <i class="bi bi-trash"></i>
                    Sil
                </button>


                <button
                    type="button"
                    class="btn btn-warning"
                    id="btnUpdate"
                >
                    <i class="bi bi-pencil-square"></i>
                    Güncelle
                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnSave"
                >
                    <i class="bi bi-check-lg"></i>
                    Kaydet
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     CONFIRMATION MODAL
========================================================= -->

<div
    class="modal fade"
    id="confirmModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-dialog-centered"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="confirmModalTitle"
                >
                    İşlem Onayı
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Kapat"
                ></button>

            </div>


            <div class="modal-body">

                <div class="confirmation-icon">
                    <i
                        class="bi bi-question-circle"
                        id="confirmationIcon"
                    ></i>
                </div>

                <p
                    class="confirmation-message"
                    id="confirmModalMessage"
                ></p>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Vazgeç
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnConfirmAction"
                >
                    Onayla
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast-container position-fixed bottom-0 end-0 p-3"
    id="toastContainer"
></div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- Application JS -->

<script src="js/app.js"></script>

</body>
</html>
